[project]
name = "wb-ops-service"
version = "0.1.0"
description = "Automation of WB reviews/questions and Honest Sign delivery reports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "pdfplumber>=0.11,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv", "node_modules", "backups", "tmp_reports", "exports", "data", "fbs_reports", "WBOPS_CABINETS"]
