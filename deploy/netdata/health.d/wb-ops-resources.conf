# WB OPS: ранние предупреждения перед нехваткой ресурсов при обновлении МП.
# Отдельные имена сохраняют штатные проверки Netdata. Получатель не задан:
# тревоги видны в dashboard/API, внешние уведомления здесь отключены.

# MemAvailable учитывает освобождаемый файловый кэш, в отличие от free RAM.
template: wb_ops_available_memory
      on: mem.available
   class: Utilization
    type: System
component: Memory
  lookup: average -1m unaligned of avail
    calc: $this * 100 / ($system.ram.used + $system.ram.cached + $system.ram.free + $system.ram.buffers)
   units: %
   every: 10s
    warn: $this < (($status >= $WARNING) ? 20 : 15)
    crit: $this < (($status == $CRITICAL) ? 10 : 7)
   delay: up 30s down 5m
 summary: WB OPS: мало доступной памяти
    info: Средняя доступная память за минуту: предупреждение ниже 15%, критический уровень ниже 7%; восстановление при 20%/10%.
      to: silent

# Проверяем и долю занятого места, и абсолютный запас (avail измеряется в GiB).
# Это важно для временных файлов отчёта даже на большом диске.
# /boot исключён: маленький системный раздел не хранит отчёты приложения.
template: wb_ops_disk_space
      on: disk.space
   class: Utilization
    type: System
component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* !/proc !/proc/* !/sys !/sys/* !/boot !/boot/* *
    calc: $used * 100 / ($avail + $used)
   units: %
   every: 30s
    warn: ($this > (($status >= $WARNING) ? 80 : 85)) || ($avail < (($status >= $WARNING) ? 3 : 2))
    crit: ($this > (($status == $CRITICAL) ? 90 : 95)) || ($avail < (($status == $CRITICAL) ? 1.5 : 1))
   delay: up 1m down 5m
 summary: WB OPS: заканчивается место на ${label:mount_point}
    info: Предупреждение при занятом месте выше 85% или остатке ниже 2 GiB; критический уровень выше 95% или ниже 1 GiB.
      to: silent

# Load включает очередь CPU и ожидание диска; нормируем на число ядер.
# load5 уже усреднён за 5 минут, дополнительное усреднение не требуется.
template: wb_ops_system_load
      on: system.load
   class: Utilization
    type: System
component: Load
  lookup: max -1m unaligned of load5
    calc: ($active_processors > 0) ? ($this * 100 / $active_processors) : nan
   units: %
   every: 30s
    warn: $this > (($status >= $WARNING) ? 100 : 150)
    crit: $this > (($status == $CRITICAL) ? 200 : 300)
   delay: up 2m down 5m
 summary: WB OPS: высокая нагрузка сервера
    info: Пятиминутная нагрузка на ядро: предупреждение выше 1.5, критический уровень выше 3; учитывает ожидание диска.
      to: silent

# Факт OOM остаётся виден полчаса после завершения аварийного процесса.
template: wb_ops_oom_kills
      on: mem.oom_kill
   class: Errors
    type: System
component: Memory
  lookup: sum -30m unaligned
   units: kills
   every: 10s
    crit: $this > 0
   delay: down 5m
 summary: WB OPS: процесс завершён из-за нехватки памяти
    info: Ядро Linux завершило процесс из-за OOM за последние 30 минут; проверьте journalctl -k и журналы wb-ops.
      to: silent
