user www-data;
worker_processes 1;

pid /run/netdata-auth-proxy.pid;
error_log /var/log/netdata-auth-proxy-error.log warn;

events {
    worker_connections 256;
}

http {
    access_log /var/log/netdata-auth-proxy-access.log;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 127.0.0.1:19998;
        server_name _;

        auth_basic "Netdata";
        auth_basic_user_file /etc/netdata-auth-proxy/htpasswd;

        location = /dashboard {
            return 302 /dashboard/;
        }

        location /dashboard/ {
            alias /opt/netdata-dashboard/;
            index index.html;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://127.0.0.1:19999;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_redirect off;
        }
    }
}
