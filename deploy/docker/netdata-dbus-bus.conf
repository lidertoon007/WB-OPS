<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/wb-ops-netdata-dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <!-- Apply this setting only to the isolated status bus. The host bus keeps its policy. -->
  <apparmor mode="disabled"/>
  <policy context="default">
    <allow user="root"/>
    <allow user="netdata"/>
    <allow user="nobody"/>
    <allow send_destination="org.freedesktop.systemd1" send_path="/org/freedesktop/systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="ListUnitsByPatterns"/>
    <allow send_destination="org.freedesktop.systemd1" send_path="/org/freedesktop/systemd1" send_interface="org.freedesktop.systemd1.Manager" send_member="ListUnits"/>
    <allow send_destination="org.freedesktop.systemd1" send_path="/org/freedesktop/systemd1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.freedesktop.DBus"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow receive_interface="org.freedesktop.DBus.Properties" receive_path="/org/freedesktop/systemd1"/>
    <allow receive_interface="org.freedesktop.systemd1.Manager" receive_path="/org/freedesktop/systemd1"/>
  </policy>
  <policy user="netdata">
    <allow own="org.freedesktop.systemd1"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
  </policy>
</busconfig>
