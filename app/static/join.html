<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в команду · WB OPS</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#1f2937;background:#f6f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 12px 32px #1118270d}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;display:grid;place-items:center;font-weight:800}
h1{font-size:20px;margin:0 0 6px}p{color:#6b7280;margin:0 0 18px;line-height:1.5;font-size:14px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;margin-bottom:14px}
input{height:42px;padding:0 12px;border:1px solid #d8d4e3;border-radius:10px;font:inherit;font-weight:400}input:focus{outline:3px solid #ede9fe;border-color:#8b5cf6}
button{width:100%;height:44px;border:0;border-radius:10px;background:#6d28d9;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}
.err{color:#b91c1c;font-size:13px;min-height:18px;margin-top:10px}
</style></head>
<body><form class="card" id="join">
  <div class="brand"><div class="logo">WB</div><strong>WB OPS</strong></div>
  <h1>Вход в команду</h1>
  <p>Вас пригласили в рабочую панель продавца. Укажите имя — его увидят в журнале действий. Вход запомнится в этом браузере.</p>
  <label>Код приглашения<input name="code" required value="{{code}}" autocomplete="off" spellcheck="false"></label>
  <label>Ваше имя<input name="name" required minlength="2" maxlength="80" autocomplete="name"></label>
  <label>Email <span style="font-weight:400;color:#6b7280">(необязательно)</span><input name="email" type="email" maxlength="120" autocomplete="email"></label>
  <button type="submit">Войти</button>
  <div class="err" role="alert" id="err"></div>
</form>
<script>
document.getElementById('join').onsubmit = async e => {
  e.preventDefault();
  const f = e.currentTarget, b = f.querySelector('button'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/team/join', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code: f.code.value.trim(), name: f.elements['name'].value.trim(), email: f.email.value.trim()})});
    const d = await r.json();
    if (!r.ok) { err.textContent = d.detail || 'Не удалось войти'; b.disabled = false; return; }
    location.href = '/';
  } catch (x) { err.textContent = 'Нет связи с панелью. Проверьте, что компьютер с WB OPS включён.'; b.disabled = false; }
};
</script></body></html>
